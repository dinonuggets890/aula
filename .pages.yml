# Pages CMS · Konfiguration für die Website der Schauspielgruppe Neusäß e.V.
# Doku: https://pagescms.org/docs/configuration/

media:
  - name: bilder
    label: Bilder
    input: src/assets/uploads
    output: /uploads
    extensions: [jpg, jpeg, png, webp, avif]
    rename: safe
  - name: dateien
    label: Dateien (PDF, Video)
    input: public/dateien
    output: /dateien
    extensions: [pdf, mp4, webm, mov]
    rename: safe

content:
  - name: programm
    label: Programm
    type: group
    items:
      - name: stuecke
        label: Stücke
        type: collection
        path: src/content/stuecke
        format: yaml-frontmatter
        filename: "{year}-{primary}.md"
        fields:
          - name: titel
            label: Titel
            type: string
            required: true
          - name: aktuell
            label: Aktuelles Stück
            description: Wird oben auf der Startseite gezeigt. Immer nur bei einem Stück aktivieren.
            type: boolean
            default: false
          - name: titel_zeile1
            label: Titel, Zeile 1 (Schreibschrift)
            description: Optional, z. B. „Die zwölf“. Leer lassen, wenn der Titel in einer Zeile stehen soll.
            type: string
          - name: titel_zeile2
            label: Titel, Zeile 2 (groß)
            description: Z. B. „Geschworenen“. Leer lassen, dann wird der ganze Titel groß gezeigt.
            type: string
          - name: rahmen_text
            label: Text im roten Rahmen
            description: Optional, kurz halten (z. B. „12“).
            type: string
          - name: autor
            label: Autor
            type: string
          - name: regie
            label: Regie
            type: string
          - name: genre
            label: Genre
            type: string
          - name: art
            label: Art
            type: select
            default: abendfuellend
            options:
              values:
                - name: abendfuellend
                  label: Abendfüllendes Stück
                - name: klein
                  label: Kleines Stück / mit Kindern
          - name: kurztext
            label: Kurzbeschreibung (Startseite)
            type: text
          - name: zitat
            label: Inhalt in einem Absatz
            description: Wird groß in Schreibschrift gezeigt.
            type: text
          - name: body
            label: Weitere Beschreibung
            type: rich-text
          - name: bild
            label: Szenenfoto
            description: Wird gezeigt, wenn kein Trailer hochgeladen ist.
            type: image
            options:
              media: bilder
          - name: trailer
            label: Trailer (Video)
            description: MP4, möglichst unter 50 MB.
            type: file
            options:
              media: dateien
              extensions: [mp4, webm, mov]
          - name: trailer_poster
            label: Vorschaubild zum Trailer
            type: image
            options:
              media: bilder
          - name: trailer_format
            label: Format des Trailers
            type: select
            default: hoch
            options:
              values:
                - name: hoch
                  label: Hochformat (Handy)
                - name: quer
                  label: Querformat
          - name: behind_the_scenes
            label: Behind-the-Scenes-Video
            type: file
            options:
              media: dateien
              extensions: [mp4, webm, mov]
          - name: behind_the_scenes_text
            label: Text zum Behind-the-Scenes-Video
            type: string
          - name: flyer
            label: Flyer (PDF)
            type: file
            options:
              media: dateien
              extensions: [pdf]
          - name: ticket_url
            label: Ticket-Link für alle Termine
            description: Link zum Ticketshop. Optional, sonst gilt der Link aus den Einstellungen.
            type: string
          - name: spielplan_titel
            label: Überschrift im Spielplan
            description: Z. B. „Zehn Abende. Zwölf Geschworene. Ein Urteil.“ Jeder Satz kommt in eine eigene Zeile.
            type: string
          - name: termine
            label: Termine
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{datum} · {uhrzeit} Uhr · {status}"
            fields:
              - name: datum
                label: Datum
                type: date
                required: true
                options:
                  format: yyyy-MM-dd
              - name: uhrzeit
                label: Uhrzeit
                type: string
                default: "19:30"
                pattern:
                  regex: "^\\d{2}:\\d{2}$"
                  message: "Bitte als HH:MM eingeben, z. B. 19:30"
              - name: premiere
                label: Premiere
                type: boolean
                default: false
              - name: status
                label: Karten
                type: select
                default: verfuegbar
                options:
                  values:
                    - name: verfuegbar
                      label: Karten verfügbar
                    - name: wenige
                      label: Nur noch wenige Karten
                    - name: ausverkauft
                      label: Ausverkauft (zeigt Warteliste)
              - name: ticket_url
                label: Ticket-Link nur für diesen Termin
                description: Optional.
                type: string
          - name: besetzung
            label: Besetzung (Es spielen)
            description: Erscheint als Theaterzettel auf der Seite „Aktuelles Stück“.
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{rolle} · {name}"
            fields:
              - name: rolle
                label: Rolle
                type: string
              - name: name
                label: Darstellerin / Darsteller
                type: string
          - name: team
            label: Team (Hinter der Bühne)
            description: Regie wird automatisch ergänzt. Z. B. Regieassistenz, Technik, Maske, Kostüm, Souffleuse.
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{aufgabe} · {name}"
            fields:
              - name: aufgabe
                label: Aufgabe
                type: string
              - name: name
                label: Name
                type: string
          - name: ensemble_bild
            label: Ensemble-Foto
            type: image
            options:
              media: bilder
          - name: preis
            label: Eintritt (Euro)
            description: Nur die Zahl, z. B. 14
            type: string
          - name: preis_ermaessigt
            label: Eintritt ermäßigt (Euro)
            type: string
          - name: ermaessigt_fuer
            label: Ermäßigung für
            description: Z. B. „Schüler, Studierende, Menschen mit Behinderung“
            type: string
          - name: abendkasse
            label: Abendkasse
            description: Z. B. „Die Abendkasse öffnet 60 Minuten vor Beginn. Restkarten je nach Verfügbarkeit.“
            type: text
          - name: probenfotos
            label: Probenfotos (Hinter den Kulissen)
            description: Bis zu vier Fotos erscheinen auf der Startseite.
            type: image
            list: true
            options:
              media: bilder
          - name: probenfotos_fotograf
            label: Fotos von
            description: Name der Fotografin / des Fotografen der Probenfotos
            type: string

  - name: verein-gruppe
    label: Verein
    type: group
    items:
      - name: verein
        label: Über uns und Mitmachen
        type: file
        path: src/data/verein.json
        format: json
        fields:
          - name: ueberschrift
            label: Überschrift
            type: string
          - name: ueberschrift_rot
            label: Überschrift, roter Teil
            type: string
          - name: ueber_uns_titel
            label: Leitsatz „Wir über uns“
            type: string
          - name: text
            label: Text „Über uns“
            description: Absätze mit einer Leerzeile trennen.
            type: text
          - name: zahlen
            label: Zahlen
            type: object
            list:
              max: 4
            fields:
              - name: wert
                label: Zahl
                type: string
              - name: text
                label: Beschriftung
                type: string
          - name: mitmachen_titel
            label: Mitmachen, Überschrift
            type: string
          - name: mitmachen_titel_kursiv
            label: Mitmachen, Überschrift kursiv
            type: string
          - name: mitmachen_text
            label: Mitmachen, Text
            type: text
          - name: mitmachen_hinweis
            label: Mitmachen, Hinweis
            type: text
          - name: mitgliedsantrag
            label: Mitgliedsantrag (PDF)
            type: file
            options:
              media: dateien
              extensions: [pdf]
          - name: datenschutz_anlage
            label: Anlage Datenschutz (PDF)
            type: file
            options:
              media: dateien
              extensions: [pdf]

      - name: junges-theater
        label: Junges Theater
        type: file
        path: src/data/junges-theater.json
        format: json
        fields:
          - name: titel
            label: Überschrift
            type: string
          - name: titel_kursiv
            label: Überschrift, kursiv
            type: string
          - name: intro
            label: Einleitung
            type: text
          - name: aktuell_titel
            label: Aktuelles Stück des JT, Titel
            description: Leer lassen, solange es noch kein Stück gibt.
            type: string
          - name: aktuell_text
            label: Aktuelles Stück des JT, Beschreibung
            type: text
          - name: aktuell_termine
            label: Aktuelles Stück des JT, Termine
            description: Z. B. „Sommerfest am 12. Juli, 15 Uhr“
            type: string
          - name: aktuell_bild
            label: Aktuelles Stück des JT, Foto
            type: image
            options:
              media: bilder
          - name: altersgruppe
            label: Für wen (Altersgruppe)
            type: string
          - name: probenzeit
            label: Probenzeiten
            type: string
          - name: probenort
            label: Probenort
            type: string
          - name: team
            label: Team
            type: object
            list: true
            fields:
              - name: name
                label: Name
                type: string
              - name: aufgabe
                label: Aufgabe
                type: string
          - name: mitmachen_text
            label: Mitmachen, Text
            type: text
          - name: kontakt
            label: Kontakt-E-Mail fürs JT
            description: Optional. Sonst gilt die E-Mail aus den Einstellungen.
            type: string

      - name: chronik
        label: Chronik
        type: file
        path: src/data/chronik.json
        format: json
        list: true
        fields:
          - name: jahr
            label: Jahr
            type: number
            required: true
          - name: titel
            label: Titel
            type: string
            required: true
          - name: art
            label: Art
            type: select
            default: abendfuellend
            options:
              values:
                - name: abendfuellend
                  label: Abendfüllendes Stück
                - name: klein
                  label: Kleines Stück / mit Kindern
                - name: hinweis
                  label: Hinweis (z. B. Pause)
          - name: info
            label: Info (Autor, Regie)
            type: string
          - name: bild
            label: Foto
            type: image
            options:
              media: bilder

      - name: fotos
        label: Fotoalbum
        type: file
        path: src/data/fotos.json
        format: json
        list: true
        fields:
          - name: bild
            label: Foto
            type: image
            required: true
            options:
              media: bilder
          - name: titel
            label: Stück
            type: string
          - name: jahr
            label: Jahr
            type: number
          - name: fotograf
            label: Foto von
            description: Name der Fotografin / des Fotografen
            type: string

  - name: website
    label: Website
    type: group
    items:
      - name: einstellungen
        label: Einstellungen
        type: file
        path: src/data/einstellungen.json
        format: json
        fields:
          - name: seitentitel
            label: Name des Vereins
            type: string
          - name: beschreibung
            label: Beschreibung für Suchmaschinen
            type: text
          - name: email
            label: E-Mail
            type: string
          - name: telefon
            label: Telefon (allgemein)
            type: string
          - name: vorsitz
            label: Vorstand
            type: object
            list: true
            fields:
              - name: rolle
                label: Funktion
                type: string
              - name: name
                label: Name
                type: string
          - name: spielort_name
            label: Spielort
            type: string
          - name: spielort_kurz
            label: Spielort, kurz
            type: string
          - name: spielort_strasse
            label: Straße
            type: string
          - name: spielort_ort
            label: PLZ und Ort
            type: string
          - name: spielort_karte
            label: Link zur Karte
            type: string
          - name: anfahrt_oepnv
            label: Anfahrt mit Bus und Bahn
            type: text
          - name: anfahrt_parken
            label: Anfahrt mit dem Auto / Parken
            type: text
          - name: anfahrt_barrierefrei
            label: Barrierefreiheit
            type: text
          - name: vorverkauf_ab
            label: Vorverkauf ab
            type: date
            options:
              format: yyyy-MM-dd
          - name: vorverkauf_stellen
            label: Vorverkaufsstellen
            type: string
          - name: kartentelefon
            label: Kartentelefon
            description: Erscheint bei den Eckdaten, auf der Kartenseite und ist auf dem Handy antippbar.
            type: string
          - name: kartentelefon_zeiten
            label: Kartentelefon, erreichbar
            description: Z. B. „Mo bis Fr, 17 bis 19 Uhr“
            type: string
          - name: warteliste
            label: Warteliste bei ausverkauften Terminen
            description: E-Mail, Telefonnummer oder Link. Leer = Kartentelefon bzw. E-Mail.
            type: string
          - name: ticketshop_url
            label: Link zum Ticketshop
            type: string
          - name: ticketshop_einbetten
            label: Ticketshop auf der Kartenseite einbetten
            description: Nur aktivieren, wenn der Anbieter das Einbetten erlaubt.
            type: boolean
          - name: ticketshop_hinweis
            label: Hinweis, solange kein Ticketshop eingebettet ist
            type: text
          - name: buehnenflaechen
            label: Bühnenflächen (Startseite, Spielplan)
            type: select
            default: dunkel
            options:
              values:
                - name: dunkel
                  label: Dunkel
                - name: hell
                  label: Cremefarben
          - name: registergericht
            label: Registergericht
            type: string
          - name: registernummer
            label: Registernummer
            type: string
          - name: verband
            label: Verband
            type: string
          - name: presse_text
            label: Presse, Text
            type: text
          - name: presse_kontakt
            label: Presse, Ansprechpartner
            type: string
          - name: presse_email
            label: Presse, E-Mail
            description: Optional. Sonst gilt die allgemeine E-Mail.
            type: string
          - name: pressemappe
            label: Pressemappe (PDF)
            type: file
            options:
              media: dateien
              extensions: [pdf]
          - name: sponsoren
            label: Sponsoren
            type: object
            list: true
            fields:
              - name: name
                label: Name
                type: string
              - name: url
                label: Website
                type: string
              - name: logo
                label: Logo
                type: image
                options:
                  media: bilder
          - name: social
            label: Social Media
            description: Z. B. Instagram, Facebook. Erscheint in der Fußzeile.
            type: object
            list: true
            fields:
              - name: name
                label: Name
                type: string
              - name: url
                label: Link
                type: string

      - name: seiten
        label: Impressum und Datenschutz
        type: collection
        path: src/content/seiten
        format: yaml-frontmatter
        fields:
          - name: titel
            label: Titel
            type: string
            required: true
          - name: body
            label: Text
            type: rich-text
