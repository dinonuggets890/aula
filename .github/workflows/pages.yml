# VORSCHAU: Baut den Branch „vorschau“ und veröffentlicht ihn auf GitHub Pages.
# Läuft bei jeder Änderung auf „vorschau“ (auch aus Pages CMS), täglich nachts
# (damit vergangene Termine verschwinden) und auf Knopfdruck.
# Freigegeben wird mit dem Workflow „Vorschau freigeben“ (freigabe.yml).
#
# Einmalig einrichten:
#   Settings › Pages › Source: „GitHub Actions“
#   Settings › Environments › github-pages › Deployment branches: „vorschau“ und „main“ erlauben

name: Vorschau veröffentlichen (GitHub Pages)

on:
  push:
    branches: [vorschau]
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Immer den Vorschau-Stand bauen, auch beim nächtlichen Lauf
      # (der läuft bei GitHub immer auf dem Standard-Branch).
      - uses: actions/checkout@v4
        with:
          ref: vorschau

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - id: pages
        uses: actions/configure-pages@v5

      - run: npm ci
      - run: npm run build
        env:
          # z. B. https://dinonuggets890.github.io und /aula
          # (bei eigener Domain: https://meine-domain.de und leer)
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Vorschau: nicht bei Google & Co. auftauchen.
          SGN_NOINDEX: '1'

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
