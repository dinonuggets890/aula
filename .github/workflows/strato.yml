# LIVE: Baut den freigegebenen Stand (Branch „main“) und lädt ihn per SFTP
# auf den Strato-Webspace. Staging bleibt weiter auf GitHub Pages.
#
# Derzeit nur manuell (Actions › Website auf Strato › Run workflow).
# Für den Launch:
#   1. Secrets unten anlegen.
#   2. Variable LIVE_STRATO = true anlegen (dann lädt „Staging freigeben“ automatisch hoch).
#   3. Die Zeilen unter „on:“ einkommentieren (Upload auch bei Pull-Request-Merge
#      und jede Nacht, damit vergangene Termine verschwinden).
#
# Benötigte Secrets (GitHub > Settings > Secrets and variables > Actions):
#   STRATO_SFTP_HOST      z. B. 5012345.ssh.w1.strato.hosting
#   STRATO_SFTP_USER      Benutzername des SFTP-Zugangs
#   STRATO_SFTP_PASSWORD  Passwort des SFTP-Zugangs
#   STRATO_SFTP_PATH      Zielordner der Domain auf dem Webspace, z. B. /schauspielgruppe

name: Website auf Strato

on:
  # push:
  #   branches: [main]
  # schedule:
  #   - cron: '17 2 * * *'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Per SFTP auf Strato hochladen
        env:
          SFTP_HOST: ${{ secrets.STRATO_SFTP_HOST }}
          SFTP_USER: ${{ secrets.STRATO_SFTP_USER }}
          LFTP_PASSWORD: ${{ secrets.STRATO_SFTP_PASSWORD }}
          ZIEL: ${{ secrets.STRATO_SFTP_PATH }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -c "set sftp:auto-confirm yes; set net:max-retries 3;
            open -u $SFTP_USER --env-password sftp://$SFTP_HOST;
            mirror --reverse --delete --verbose --parallel=4 --exclude-glob .well-known/ dist/ $ZIEL"
